# api.nas86.eu — public HTTPS → farm/queue.py on localhost:8766
# People curl JSON here. Workers still use 127.0.0.1:8765 (never publish that).
#
# DNS:  api.nas86.eu  A  (same IP as creator.nas86.eu)
# On the NAS (or whichever box nginx runs on):
#   export DVFORGE_FARM_TOKEN=pick-a-secret
#   python3 /path/to/dvforge/farm/queue.py --host 127.0.0.1 --port 8766
#
# Drop this file into nginx conf.d / sites-enabled and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name api.nas86.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nas86.eu;

    # Use the same certs you already have for nas86.eu (or a dedicated SAN).
    ssl_certificate     /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    client_max_body_size 80m;

    location / {
        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}

# Optional: if creator.nas86.eu currently reverse-proxies DVForge :8765,
# lock /api/build so strangers cannot start compiles. The queue is enough
# for "someone posts a JSON".
#
#   location /api/build/ {
#       deny all;
#       return 403;
#   }
