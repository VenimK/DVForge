<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="DVForge banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#12151d"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19E646"/>
      <stop offset="1" stop-color="#19DBE6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2430" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="70" y="130" font-size="82" font-weight="800" fill="#f5f7fa">DV<tspan fill="#19E646">Forge</tspan></text>
    <text x="74" y="178" font-size="27" font-weight="600" fill="#aeb6c2">Build your own branded RustDesk client — locally.</text>
    <text x="74" y="214" font-size="19" fill="#7c8695">No GitHub · No cloud CI · No pip installs · Windows · macOS · Linux · Android</text>
  </g>
  <g transform="translate(880,60)" font-family="'JetBrains Mono','Courier New',monospace" font-size="15">
    <rect x="0" y="0" width="270" height="180" rx="10" fill="#0e1117" stroke="#232a36"/>
    <circle cx="20" cy="22" r="5" fill="#ff5f56"/><circle cx="40" cy="22" r="5" fill="#ffbd2e"/><circle cx="60" cy="22" r="5" fill="#27c93f"/>
    <text x="18" y="62" fill="#7c8695">$ ./run.sh</text>
    <text x="18" y="88" fill="#19DBE6">→ 127.0.0.1:8765</text>
    <text x="18" y="114" fill="#7c8695">▸ pick target</text>
    <text x="18" y="140" fill="#19E646">✓ output/YourApp.exe</text>
    <text x="18" y="166" fill="#4b5563">■ streaming build log…</text>
  </g>
</svg>
