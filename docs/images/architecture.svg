<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="DVForge architecture diagram" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1219"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <style>
      .box{fill:#151a24;stroke:#2a3342;stroke-width:1.5;rx:12;}
      .lbl{fill:#eef1f5;font-weight:700;font-size:16px;}
      .sub{fill:#8a93a1;font-size:12.5px;}
      .tag{fill:#5b6472;font-size:11px;font-family:'JetBrains Mono',monospace;}
      .edge{stroke:#5b6472;stroke-width:2;fill:none;}
      .accent{fill:#19E646;}
      .accent2{fill:#19DBE6;}
    </style>
  </defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <text x="30" y="42" fill="#f5f7fa" font-size="22" font-weight="800">DVForge — architecture</text>
  <text x="30" y="66" class="sub">Everything runs locally on 127.0.0.1. Nothing installs system-wide.</text>

  <!-- Browser -->
  <rect class="box" x="30" y="100" width="230" height="130" rx="12"/>
  <text x="46" y="128" class="lbl">🖥️ Browser GUI</text>
  <text x="46" y="152" class="sub">web/ — HTML · CSS · vanilla JS</text>
  <text x="46" y="174" class="sub">Tabs: Targets · Config · Build</text>
  <text x="46" y="196" class="sub">Left rail: toolchains · updates</text>
  <text x="46" y="220" class="tag">no framework · no Node</text>

  <!-- Server -->
  <rect class="box" x="365" y="100" width="240" height="130" rx="12"/>
  <text x="381" y="128" class="lbl">⚙️ app.py</text>
  <text x="381" y="152" class="sub">ThreadingHTTPServer (stdlib)</text>
  <text x="381" y="174" class="sub">JSON API + SSE log stream</text>
  <text x="381" y="196" class="sub">static file serving</text>
  <text x="381" y="220" class="tag accent">0 pip dependencies</text>

  <!-- Builder engine -->
  <rect class="box" x="700" y="100" width="230" height="200" rx="12"/>
  <text x="716" y="128" class="lbl">🧠 builder/</text>
  <text x="716" y="152" class="sub">detect.py · prereqs.py</text>
  <text x="716" y="172" class="sub">toolchains.py</text>
  <text x="716" y="192" class="sub">config_gen.py</text>
  <text x="716" y="212" class="sub">customize.py</text>
  <text x="716" y="232" class="sub">orchestrator.py · signing.py</text>
  <text x="716" y="262" class="tag">detection · patch · compile</text>
  <text x="716" y="282" class="tag">collect artifacts</text>

  <!-- edges top row -->
  <line class="edge" x1="260" y1="150" x2="360" y2="150" marker-end="url(#arrow)"/>
  <text x="272" y="142" class="tag">fetch / SSE</text>
  <line class="edge" x1="605" y1="150" x2="695" y2="150" marker-end="url(#arrow)"/>
  <text x="612" y="142" class="tag">invoke</text>

  <!-- Toolchains -->
  <rect class="box" x="700" y="330" width="230" height="90" rx="12"/>
  <text x="716" y="358" class="lbl">📦 .toolchains/</text>
  <text x="716" y="382" class="sub">Flutter · Rust · LLVM · NDK</text>
  <text x="716" y="402" class="sub">JDK · vcpkg · env.json</text>
  <line class="edge" x1="815" y1="300" x2="815" y2="328" marker-end="url(#arrow)"/>

  <!-- Pipeline lane -->
  <rect x="30" y="330" width="575" height="200" rx="12" fill="#10141d" stroke="#232a36" stroke-width="1.5"/>
  <text x="46" y="358" fill="#f5f7fa" font-size="15" font-weight="700">🔧 Build pipeline (orchestrator.py)</text>

  <!-- pipeline steps -->
  <g font-size="12">
    <rect x="46" y="374" width="120" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="56" y="396" class="sub">1 · clean</text><text x="56" y="414" class="tag">git clone v1.4.9</text>

    <rect x="178" y="374" width="120" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="188" y="396" class="sub">2 · patch</text><text x="188" y="414" class="tag">allowCustom …</text>

    <rect x="310" y="374" width="120" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="320" y="396" class="sub">3 · bake cfg</text><text x="320" y="414" class="tag">sed source</text>

    <rect x="442" y="374" width="140" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="452" y="396" class="sub">4 · custom_.txt</text><text x="452" y="414" class="tag">base64 runtime</text>

    <rect x="46" y="446" width="120" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="56" y="468" class="sub">5 · bridge</text><text x="56" y="486" class="tag">frb 1.80.1</text>

    <rect x="178" y="446" width="120" height="52" rx="8" fill="#151a24" stroke="#2a3342"/>
    <text x="188" y="468" class="sub">6 · compile</text><text x="188" y="486" class="tag">cargo+flutter</text>

    <rect x="310" y="446" width="272" height="52" rx="8" fill="#12251a" stroke="#1f7a34"/>
    <text x="320" y="468" class="accent" font-weight="700">7 · collect → workspace/output/</text>
    <text x="320" y="486" class="tag">exe · msi · dmg · deb · rpm · apk</text>
  </g>

  <!-- edge from server to pipeline -->
  <line class="edge" x1="430" y1="230" x2="360" y2="330" marker-end="url(#arrow)"/>
  <text x="300" y="290" class="tag">POST /api/build/start</text>

  <!-- host-lock note -->
  <text x="46" y="524" class="tag accent2">Desktop = host-locked · Android = any Linux/macOS host</text>
</svg>
